<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ye Game Shop</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:#2563eb;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    color:black;
    width:280px;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.price{
    color:#2563eb;
    font-size:22px;
    font-weight:bold;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#15803d;
}

.order{
    background:#1f2937;
    margin:20px;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

input, select{
    padding:10px;
    margin:5px;
    width:80%;
    border-radius:5px;
    border:none;
}

footer{
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<header>
<h1>🎮 Ye Game Shop</h1>
<p>Fast & Secure Game Items</p>
</header>


<div class="container">

<div class="card">
<h2>🔥 PUBG UC</h2>
<p>60 UC</p>
<p class="price">5,000 Ks</p>
<button onclick="order('PUBG UC 60')">Buy Now</button>
</div>


<div class="card">
<h2>💎 MLBB Diamond</h2>
<p>100 Diamond</p>
<p class="price">6,000 Ks</p>
<button onclick="order('MLBB Diamond 100')">Buy Now</button>
</div>


<div class="card">
<h2>💰 Free Fire Diamond</h2>
<p>100 Diamond</p>
<p class="price">4,500 Ks</p>
<button onclick="order('Free Fire Diamond 100')">Buy Now</button>
</div>

</div>


<div class="order">

<h2>Order Form</h2>

<input id="name" placeholder="Your Name">

<br>

<input id="gameid" placeholder="Game ID">

<br>

<select id="payment">
<option>KBZ Pay</option>
<option>Wave Money</option>
<option>Bank Transfer</option>
</select>

<br><br>

<button onclick="sendOrder()">Send Order</button>

</div>


<footer>
<p>Contact: Telegram / Messenger</p>
</footer>


<script>

let item="";

function order(product){
    item=product;
    alert(product+" Selected");
}


function sendOrder(){

let name=document.getElementById("name").value;
let id=document.getElementById("gameid").value;
let pay=document.getElementById("payment").value;


let message=
"Game Order%0A"+
"Item: "+item+"%0A"+
"Name: "+name+"%0A"+
"Game ID: "+id+"%0A"+
"Payment: "+pay;


window.open(
"https://t.me/YOUR_TELEGRAM_USERNAME?text="+message
);

}

</script>


</body>
  </html>
